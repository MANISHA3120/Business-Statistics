<script>
const UNITS = [];
UNITS.push({
  n: 1,
  title: "Foundations of Business Research & Statistics",
  short: "Foundations",
  cos: "CO1, CO2",
  caseStudy: {
    name: "Pelican Stores – Department Store Sales",
    text: `Pelican Stores, a national chain of women's apparel stores, ran a promotion with discount coupons. The data for 100 in-store credit card transactions records customer type (Promotional / Regular), items bought, net sales, payment method, gender, marital status and age.`,
    tasks: [
      "Classify every variable as categorical or quantitative and name its measurement scale.",
      "Clean the file in Excel: apply Data Validation to Customer Type, remove duplicate transaction IDs, and flag blank Net Sales cells with =IF(ISBLANK(F2),\"Missing\",\"OK\").",
      "Which sampling method would you use if Pelican wanted to survey 50 of its 10,000 promotional customers, spread across four regions? Justify.",
      "List two ethical issues in storing customers' age and marital status, and how you would handle them."
    ]
  },
  topics: [
    {
      id: "1-1",
      title: "Introduction to Business Research",
      sub: "Importance, types and process",
      notes: `
<p><b>Business research</b> is the systematic and objective process of collecting, recording, analysing and interpreting data to help managers make better decisions. The key word is <em>decision</em>: research is useful only when it reduces the uncertainty around a real business choice.</p>
<h4>Why it matters</h4>
<ul>
<li>Replaces guesswork and opinion with evidence.</li>
<li>Identifies opportunities (new markets, unmet needs) and problems (falling sales, churn).</li>
<li>Evaluates alternatives before money is committed, e.g. testing two ad campaigns.</li>
<li>Monitors performance after a decision has been implemented.</li>
</ul>
<h4>Types of research</h4>
<table class="tbl"><tr><th>Type</th><th>Purpose</th><th>Business example</th></tr>
<tr><td>Exploratory</td><td>Clarify a vague problem; generate ideas and hypotheses</td><td>Focus groups to learn why young buyers avoid a brand</td></tr>
<tr><td>Descriptive</td><td>Describe who, what, when, where, how much</td><td>Survey measuring customer satisfaction scores by city</td></tr>
<tr><td>Causal (Experimental)</td><td>Test cause-and-effect</td><td>A/B test: does free delivery increase order value?</td></tr>
<tr><td>Applied vs Basic</td><td>Solve a specific problem vs extend general knowledge</td><td>Pricing study for one product vs theory of price elasticity</td></tr>
<tr><td>Qualitative vs Quantitative</td><td>Words, meanings vs numbers, measurement</td><td>In-depth interviews vs a 500-person structured survey</td></tr>
</table>
<h4>The research process (a real sequence)</h4>
<ol>
<li><b>Define the management problem</b> and convert it to a research problem.</li>

<p>Before any analysis you must know what <b>kind of data</b> you have, because the measurement scale decides which statistics and tests are valid.</p>
<h4>Qualitative vs quantitative</h4>
<ul><li><b>Qualitative (categorical):</b> labels or categories – payment method, gender, region.</li>
<li><b>Quantitative (numerical):</b> counts or measurements – units sold (discrete), sales value in ₹ (continuous).</li></ul>
<h4>The four scales (NOIR)</h4>
<table class="tbl"><tr><th>Scale</th><th>Property</th><th>Example</th><th>Valid statistics</th></tr>
<tr><td><b>Nominal</b></td><td>Categories only, no order</td><td>Payment mode: Cash, Card, UPI</td><td>Frequency, %, mode, chi-square</td></tr>
<tr><td><b>Ordinal</b></td><td>Ordered categories, unequal gaps</td><td>Satisfaction: Low / Medium / High; rank of brands</td><td>+ Median, percentiles, Spearman, Mann-Whitney</td></tr>
<tr><td><b>Interval</b></td><td>Equal gaps, no true zero</td><td>Temperature °C; index scores</td><td>+ Mean, SD, Pearson r, t-test</td></tr>
<tr><td><b>Ratio</b></td><td>Equal gaps and true zero</td><td>Sales ₹, age, income, units</td><td>All statistics incl. ratios, CV, geometric mean</td></tr></table>
<p class="tip"><b>Remember:</b> Each scale has all properties of the ones above it. You can say "₹40 lakh is twice ₹20 lakh" (ratio) but not "40°C is twice as hot as 20°C" (interval).</p>
<p><b>Likert scales</b> (1 = Strongly disagree … 5 = Strongly agree) are technically ordinal, but in business research the summed score of several items is often treated as interval so that means and t-tests can be used.</p>

<p>A <b>population</b> is the entire group you want to study; a <b>sample</b> is the subset you actually observe. The list from which the sample is drawn is the <b>sampling frame</b> (e.g. a customer database).</p>
<h4>Probability sampling (each unit has a known chance)</h4>
<ul>
<li><b>Simple random sampling (SRS):</b> every unit has an equal chance. Use random numbers (<code>=RAND()</code>) to pick.</li>
<li><b>Systematic sampling:</b> choose every k-th unit after a random start, where k = N / n.</li>
<li><b>Stratified sampling:</b> divide the population into homogeneous groups (strata) like region or income, then draw a random sample from each. Improves precision and ensures every group is represented.</li>
<li><b>Cluster sampling:</b> divide into naturally occurring groups (stores, cities, schools), randomly select some clusters, and study all or some units within them. Cheaper when the population is spread out.</li>
</ul>
<h4>Non-probability sampling</h4>
<p>Convenience, judgement (purposive), quota and snowball sampling. Faster and cheaper, but results cannot be generalised with a known margin of error.</p>
<h4>Sampling vs non-sampling error</h4>
<p><b>Sampling error</b> is the natural difference between a sample statistic and the population value; it falls as n increases. <b>Non-sampling errors</b> – wrong frame, non-response, biased questions, data entry mistakes – do not fall with larger samples.</p>

<p>Research ethics protect the people who give data and the organisations that rely on the results. Unethical research can cause legal penalties, reputational damage and wrong decisions.</p>
<h4>Core principles</h4>
<ul><li><b>Informed consent:</b> participants know the purpose, what data is collected and can withdraw.</li>
<li><b>Confidentiality and anonymity:</b> personal identifiers are removed or protected.</li>
<li><b>No harm or deception:</b> avoid misleading participants; debrief if deception is unavoidable.</li>
<li><b>Honest reporting:</b> no fabrication, falsification or selective reporting ("p-hacking").</li></ul>
<h4>Data protection laws</h4>
<ul><li><b>GDPR (EU, 2018):</b> lawful basis for processing, purpose limitation, data minimisation, right to access and erasure, fines up to €20 million or 4% of global turnover.</li>
<li><b>India – Digital Personal Data Protection Act, 2023:</b> consent-based processing, duties of "data fiduciaries", rights of "data principals", penalties for breaches.</li></ul>
<h4>Bias in research</h4>
<table class="tbl"><tr><th>Bias</th><th>Meaning</th><th>Example</th></tr>

<tr><td>Confirmation bias</td><td>Researcher looks only for supporting evidence</td><td>Dropping data that contradict the hypothesis</td></tr>

      sub: "Mean, Median, Mode",
      notes: `
<p>A measure of central tendency summarises a data set with a single "typical" value.</p>
<h4>Mean (arithmetic average)</h4>
<p>Sum of values divided by their number. Uses every observation, but is pulled by extreme values (outliers).</p>
<h4>Median</h4>
<p>The middle value when data are sorted. Robust to outliers – preferred for skewed data like income, house prices or order values.</p>
<h4>Mode</h4>
<p>The most frequent value. The only measure valid for nominal data (most popular size, colour, payment mode). A data set may be bimodal or have no mode.</p>
<h4>Weighted mean</h4>
<p>Used when observations have different importance – e.g. average purchase price across suppliers with different quantities, or a GPA.</p>
<h4>Choosing the right measure</h4>
<table class="tbl"><tr><th>Situation</th><th>Best measure</th></tr><tr><td>Symmetric numeric data</td><td>Mean</td></tr><tr><td>Skewed data / outliers (salaries, bill values)</td><td>Median</td></tr><tr><td>Categorical data (best-selling shoe size)</td><td>Mode</td></tr></table>
<p class="tip">In a right-skewed distribution: Mode &lt; Median &lt; Mean. In a left-skewed one the order reverses.</p>`,
      formulas: ["Mean x̄ = Σx / n", "Median = value at position (n + 1)/2 of sorted data", "Weighted mean = Σwx / Σw", "Grouped mean = Σf·m / Σf  (m = class mid-point)", "Grouped median = L + [(n/2 − cf) / f] × h", "Grouped mode = L + [(f₁ − f₀) / (2f₁ − f₀ − f₂)] × h"],
      example: `<p><b>Daily sales (units) of a bakery for a week:</b> 12, 15, 11, 18, 15, 20, 14</p>
<ul><li>Mean = (12+15+11+18+15+20+14) / 7 = 105 / 7 = <b>15 units</b></li>
<li>Sorted: 11, 12, 14, <b>15</b>, 15, 18, 20 → Median = 4th value = <b>15</b></li>
<li>Mode = <b>15</b> (occurs twice)</li></ul>
<p>All three agree, so the data are roughly symmetric. Now suppose a festival day brings Saturday's sales to 60: mean jumps to 145/7 = 20.7, but the median stays 15. The median better represents a "normal" day.</p>`,
      numericals: [
        { q: `A company buys a raw material from three suppliers: 50 kg at ₹20/kg, 30 kg at ₹25/kg and 20 kg at ₹30/kg. Find the average cost per kg.`,
          s: `<p>Weighted mean = Σwx / Σw = (50×20 + 30×25 + 20×30) / (50+30+20) = (1,000 + 750 + 600) / 100 = <b>₹23.50 per kg</b>.</p><p>The simple mean (20+25+30)/3 = ₹25 is wrong because it ignores quantities.</p>` },
        { q: `Order values (₹'00) of 30 online orders:<br><table class="tbl"><tr><th>Class</th><th>0–10</th><th>10–20</th><th>20–30</th><th>30–40</th></tr><tr><td>f</td><td>5</td><td>8</td><td>12</td><td>5</td></tr></table>Find the mean, median and mode.`,
          s: `<p><b>Mean:</b> mid-points 5, 15, 25, 35. Σfm = 25 + 120 + 300 + 175 = 620. Mean = 620 / 30 = <b>20.67</b> (₹2,067).</p>
<p><b>Median:</b> n/2 = 15. Cumulative f: 5, 13, 25, 30 → median class 20–30. L = 20, cf = 13, f = 12, h = 10.<br>Median = 20 + [(15 − 13)/12] × 10 = 20 + 1.67 = <b>21.67</b>.</p>
<p><b>Mode:</b> modal class 20–30, f₁ = 12, f₀ = 8, f₂ = 5.<br>Mode = 20 + [(12 − 8)/(24 − 8 − 5)] × 10 = 20 + (4/11) × 10 = <b>23.64</b>.</p>
<p>Mean &lt; Median &lt; Mode suggests slight left (negative) skew.</p>` }
      ],
      practice: [
        { q: "Salaries (₹'000/month) of 6 employees: 25, 28, 30, 32, 35, 250. Compute mean and median. Which better represents a typical salary?", a: "Mean = 400/6 = 66.67; Median = (30+32)/2 = 31. Median, because 250 is an outlier." },
        { q: "A student scores 80 (4 credits), 70 (3 credits), 90 (2 credits). Find the weighted average.", a: "(320+210+180)/9 = 710/9 = 78.9" },

        { q: "The mean of 10 values is 45. If one value 60 is replaced by 40, what is the new mean?", a: "New sum = 450 − 20 = 430; mean = 43." },

      excel: `<ul><li><code>=AVERAGE(B2:B8)</code>, <code>=MEDIAN(B2:B8)</code>, <code>=MODE.SNGL(B2:B8)</code> (use <code>MODE.MULT</code> for several modes).</li><li>Weighted mean: <code>=SUMPRODUCT(B2:B4,C2:C4)/SUM(B2:B4)</code>.</li><li>Trimmed mean (drops 10% extremes): <code>=TRIMMEAN(B2:B51,0.1)</code>.</li><li>Analysis ToolPak → Descriptive Statistics → tick <i>Summary statistics</i> gives all at once.</li></ul><div class="fx"><span>fx</span>=SUMPRODUCT(B2:B4,C2:C4)/SUM(B2:B4)</div>`

    {
      id: "2-2",
      title: "Measures of Dispersion",
      sub: "Variance, Standard Deviation, Range, IQR",
      notes: `
<p>Two data sets can have the same mean but very different spread. Dispersion measures <b>consistency and risk</b> – crucial in finance, quality and operations.</p>
<ul><li><b>Range</b> = Max − Min. Simple but depends only on two extreme values.</li>
<li><b>Interquartile range (IQR)</b> = Q3 − Q1: spread of the middle 50%. Robust to outliers; used in box plots.</li>
<li><b>Variance</b>: average squared deviation from the mean. Sample variance divides by (n − 1) to give an unbiased estimate.</li>
<li><b>Standard deviation (SD)</b>: square root of variance, in the original units (₹, units, minutes).</li>
<li><b>Coefficient of variation (CV)</b>: SD as % of mean – compares variability across data with different units or scales.</li></ul>
<h4>Empirical rule (bell-shaped data)</h4>
<p>About 68% of values lie within ±1 SD of the mean, 95% within ±2 SD and 99.7% within ±3 SD.</p>
<h4>Outlier fences</h4>
<p>Values below Q1 − 1.5×IQR or above Q3 + 1.5×IQR are potential outliers.</p>`,
      formulas: ["Sample variance s² = Σ(x − x̄)² / (n − 1)", "Standard deviation s = √s²", "IQR = Q3 − Q1", "CV = (s / x̄) × 100%", "z-score = (x − x̄) / s"],
      example: `<p><b>Delivery times (days) for 5 orders:</b> 4, 8, 6, 10, 12</p>
<table class="tbl"><tr><th>x</th><th>x − x̄</th><th>(x − x̄)²</th></tr><tr><td>4</td><td>−4</td><td>16</td></tr><tr><td>8</td><td>0</td><td>0</td></tr><tr><td>6</td><td>−2</td><td>4</td></tr><tr><td>10</td><td>2</td><td>4</td></tr><tr><td>12</td><td>4</td><td>16</td></tr><tr><td><b>Σ = 40</b></td><td>0</td><td><b>40</b></td></tr></table>
<p>x̄ = 40/5 = 8 days. s² = 40 / (5 − 1) = <b>10</b>. s = √10 = <b>3.16 days</b>. Range = 12 − 4 = 8 days. CV = 3.16/8 = 39.5%.</p>
<p>Interpretation: delivery time varies quite a lot; a customer promise of "within 8 days" will often be broken.</p>`,
      numericals: [
        { q: `Two mutual funds: Fund A has average return 15% with SD 3%; Fund B has average return 20% with SD 5%. Which is more consistent?`,
          s: `<p>CV<sub>A</sub> = 3/15 × 100 = <b>20%</b>; CV<sub>B</sub> = 5/20 × 100 = <b>25%</b>.</p><p>Fund A has the lower CV, so it is <b>more consistent</b> relative to its return, although Fund B earns more on average. A risk-averse investor may prefer A.</p>` },
        { q: `Monthly sales (₹ lakh) of 8 branches: 12, 15, 18, 22, 25, 28, 30, 40. Using Excel's QUARTILE.EXC method, find Q1, Q3, IQR and check whether 40 is an outlier.`,
          s: `<p>Q1 position = (n+1)/4 = 9/4 = 2.25 → 15 + 0.25×(18 − 15) = <b>15.75</b></p><p>Q3 position = 3(n+1)/4 = 6.75 → 28 + 0.75×(30 − 28) = <b>29.5</b></p><p>IQR = 29.5 − 15.75 = <b>13.75</b></p><p>Upper fence = 29.5 + 1.5 × 13.75 = 50.125. Since 40 &lt; 50.125, <b>40 is not an outlier</b>.</p>` },
        { q: `A store's daily sales have mean ₹50,000 and SD ₹5,000 and are bell-shaped. Between what values do about 95% of days fall? What is the z-score of a ₹62,000 day?`,
          s: `<p>95% ≈ mean ± 2 SD = 50,000 ± 10,000 → <b>₹40,000 to ₹60,000</b>.</p><p>z = (62,000 − 50,000) / 5,000 = <b>2.4</b> – an unusually good day.</p>` }
      ],
      practice: [
        { q: "Compute the sample variance and SD of: 10, 12, 14, 16, 18.", a: "Mean 14; Σd² = 16+4+0+4+16 = 40; s² = 10; s = 3.16." },
        { q: "Why do we divide by (n − 1) and not n in sample variance?", a: "Because the sample mean is used in place of μ, which makes deviations slightly smaller; n − 1 (degrees of freedom) corrects this bias." },
        { q: "Product X: mean weight 500 g, SD 10 g. Product Y: mean 200 g, SD 6 g. Which is packed more consistently?", a: "CV X = 2%, CV Y = 3% → X is more consistent." },
        { q: "What does an IQR of 0 indicate?", a: "The middle 50% of values are identical." },
        { q: "State the empirical rule.", a: "≈68% within ±1 SD, 95% within ±2 SD, 99.7% within ±3 SD for bell-shaped data." }
      ],
      excel: `<ul><li><code>=VAR.S(B2:B6)</code>, <code>=STDEV.S(B2:B6)</code> (sample) – use <code>.P</code> versions for a full population.</li><li><code>=MAX(B2:B9)-MIN(B2:B9)</code> for range.</li><li><code>=QUARTILE.EXC(B2:B9,3)-QUARTILE.EXC(B2:B9,1)</code> for IQR.</li><li><code>=STANDARDIZE(B2,AVERAGE($B$2:$B$9),STDEV.S($B$2:$B$9))</code> for z-scores.</li></ul><div class="fx"><span>fx</span>=STDEV.S(B2:B6)/AVERAGE(B2:B6)</div>`
    },
    {
      id: "2-3",
      title: "Skewness and Kurtosis",
      sub: "Shape of business data",
      notes: `
<p>Mean and SD do not tell us the <b>shape</b> of a distribution. Skewness and kurtosis do.</p>
<h4>Skewness – asymmetry</h4>
<ul><li><b>Positive (right) skew:</b> long tail to the right; Mean &gt; Median. Typical of incomes, order values, insurance claims, time on website.</li>
<li><b>Negative (left) skew:</b> long tail to the left; Mean &lt; Median. E.g. exam scores on an easy test, product life of reliable machines.</li>
<li><b>Zero skew:</b> symmetric (e.g. normal distribution).</li></ul>
<p>Rule of thumb for Excel's SKEW: between −0.5 and +0.5 ≈ symmetric; beyond ±1 = highly skewed.</p>
<h4>Kurtosis – tailedness</h4>
<ul><li><b>Leptokurtic</b> (excess kurtosis &gt; 0): heavy tails, more extreme values – common in stock returns ("fat tails" = more crash risk).</li>
<li><b>Mesokurtic</b> (≈ 0): normal-like.</li>
<li><b>Platykurtic</b> (&lt; 0): light tails, flatter.</li></ul>
<p class="tip">Excel's <code>KURT</code> returns <b>excess</b> kurtosis, so a normal distribution gives about 0, not 3.</p>
<h4>Why managers care</h4>
<p>Skewed data make the mean misleading (report the median), and many tests (t-test, regression) assume approximate normality. Heavy tails mean risk models based on SD alone underestimate extreme losses.</p>`,
      formulas: ["Pearson's 1st coefficient Sk = (Mean − Mode) / s", "Pearson's 2nd coefficient Sk = 3(Mean − Median) / s", "Bowley's (quartile) Sk = (Q3 + Q1 − 2·Median) / (Q3 − Q1)"],
      example: `<p><b>Website session time:</b> mean = 52 seconds, median = 48 seconds, SD = 12 seconds.</p>
<p>Sk = 3(52 − 48)/12 = 12/12 = <b>+1.0</b> → moderately to highly right-skewed. A few visitors stay very long, pulling the mean up. The UX team should report the median (48 s) as the typical visit.</p>`,
      numericals: [
        { q: `For monthly household spending on eating out: Q1 = ₹1,200, Median = ₹1,800, Q3 = ₹3,000. Compute Bowley's coefficient of skewness and interpret.`,
          s: `<p>Sk<sub>B</sub> = (Q3 + Q1 − 2·Median) / (Q3 − Q1) = (3,000 + 1,200 − 3,600) / (3,000 − 1,200) = 600 / 1,800 = <b>+0.33</b></p><p>Positive → the upper half is more spread out; a few households spend a lot. The distribution is moderately right-skewed.</p>` },
        { q: `Daily returns of Stock A have Excel KURT = 4.2 and SKEW = −0.8. Interpret for a risk manager.`,
          s: `<p>Excess kurtosis 4.2 → <b>leptokurtic</b> (fat tails): extreme daily moves happen far more often than a normal model predicts.</p><p>Skew −0.8 → <b>negatively skewed</b>: the large moves are mostly <b>losses</b>. Value-at-Risk based on a normal curve would underestimate downside risk; use historical simulation or stress testing.</p>` }
      ],
      practice: [
        { q: "Mean = 60, Median = 64, SD = 8. Compute Pearson's 2nd coefficient.", a: "3(60 − 64)/8 = −1.5 → strongly left-skewed." },
        { q: "Why is income usually right-skewed?", a: "Most people earn moderate amounts, a few earn very high amounts; the lower bound is 0, but there is no upper limit." },
        { q: "Excel KURT returns −1.1 for a data set. What type of kurtosis is this?", a: "Platykurtic (flatter, light tails)." },
        { q: "If a distribution is symmetric, what is the relation between mean and median?", a: "They are equal (and equal the mode if unimodal)." },
        { q: "Mean = 100, Mode = 90, SD = 20. Find Pearson's 1st coefficient.", a: "(100 − 90)/20 = +0.5" }
      ],
      excel: `<ul><li><code>=SKEW(B2:B51)</code> and <code>=KURT(B2:B51)</code>.</li><li>Descriptive Statistics tool reports both automatically.</li><li>Visual check: Insert → Chart → Histogram to see the tail direction.</li></ul><div class="fx"><span>fx</span>=3*(AVERAGE(B2:B51)-MEDIAN(B2:B51))/STDEV.S(B2:B51)</div>`
    },
    {
      id: "2-4",
      title: "Correlation Analysis",
      sub: "Pearson and Spearman",
      notes: `
<p><b>Correlation</b> measures the strength and direction of a linear relationship between two variables. The coefficient r lies between −1 and +1.</p>
<table class="tbl"><tr><th>|r|</th><th>Strength</th></tr><tr><td>0.0 – 0.3</td><td>Weak</td></tr><tr><td>0.3 – 0.7</td><td>Moderate</td></tr><tr><td>0.7 – 1.0</td><td>Strong</td></tr></table>
<h4>Pearson's r</h4><p>For interval/ratio data with a linear relationship. Sensitive to outliers.</p>
<h4>Spearman's rank correlation (r<sub>s</sub>)</h4><p>For ordinal data (rankings) or when the relationship is monotonic but not linear, or outliers are present. Computed on ranks.</p>
<h4>Cautions</h4>
<ul><li><b>Correlation ≠ causation.</b> Ice-cream sales and AC sales are correlated because both depend on temperature (a confounding variable).</li>
<li>r = 0 means no <em>linear</em> relationship – there may still be a curved one. Always plot a scatter chart.</li>
<li>r² (coefficient of determination) = share of variation in Y explained by X.</li></ul>`,
      formulas: ["r = Σ(x − x̄)(y − ȳ) / √[Σ(x − x̄)² · Σ(y − ȳ)²]", "r<sub>s</sub> = 1 − 6Σd² / [n(n² − 1)]   (d = difference in ranks)", "Test of r: t = r√(n − 2) / √(1 − r²), df = n − 2"],
      example: `<p><b>Advertising spend (₹ lakh) vs Sales (₹ lakh) for 5 months:</b></p>
<table class="tbl"><tr><th>x</th><th>y</th><th>x − x̄</th><th>y − ȳ</th><th>(x−x̄)(y−ȳ)</th><th>(x−x̄)²</th><th>(y−ȳ)²</th></tr>
<tr><td>2</td><td>20</td><td>−4</td><td>−15</td><td>60</td><td>16</td><td>225</td></tr>
<tr><td>4</td><td>28</td><td>−2</td><td>−7</td><td>14</td><td>4</td><td>49</td></tr>
<tr><td>6</td><td>35</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr>
<tr><td>8</td><td>44</td><td>2</td><td>9</td><td>18</td><td>4</td><td>81</td></tr>
<tr><td>10</td><td>48</td><td>4</td><td>13</td><td>52</td><td>16</td><td>169</td></tr>
<tr><td colspan="4"><b>x̄ = 6, ȳ = 35</b></td><td><b>144</b></td><td><b>40</b></td><td><b>524</b></td></tr></table>
<p>r = 144 / √(40 × 524) = 144 / 144.78 = <b>0.995</b> → very strong positive relationship. r² = 0.989: about 99% of the variation in sales is associated with ad spend (in this small sample).</p>`,
      numericals: [
        { q: `Two judges rank 5 sales trainees. Scores by Judge A: 85, 70, 90, 60, 75; Judge B: 80, 65, 88, 70, 72. Compute Spearman's rank correlation.`,
          s: `<p>Ranks (1 = highest): A → 2, 4, 1, 5, 3. B → 2, 5, 1, 4, 3.</p><p>d = 0, −1, 0, 1, 0 → Σd² = 2.</p><p>r<sub>s</sub> = 1 − 6(2) / [5(25 − 1)] = 1 − 12/120 = <b>0.90</b> → the judges agree strongly.</p>` },
        { q: `For n = 12 stores, r between shelf space and sales is 0.62. Is the correlation significant at 5%? (t<sub>crit</sub>, df 10 = 2.228)`,
          s: `<p>t = r√(n−2)/√(1−r²) = 0.62 × √10 / √(1 − 0.3844) = 0.62 × 3.162 / 0.7846 = <b>2.50</b></p><p>2.50 &gt; 2.228 → <b>reject H₀: ρ = 0</b>. Shelf space and sales are significantly positively correlated. (Still not proof that more shelf space <em>causes</em> more sales.)</p>` }
      ],
      practice: [
        { q: "Give an example of a spurious correlation in business and name the hidden variable.", a: "Umbrella sales and taxi bookings rise together – both driven by rain." },
        { q: "If r = −0.85 between price and quantity sold, interpret.", a: "Strong negative linear relationship: higher prices associated with lower quantities." },
        { q: "When should you use Spearman instead of Pearson?", a: "Ordinal/ranked data, non-linear monotonic relationship, or strong outliers." },
        { q: "r = 0.7. What percentage of variation in Y is explained by X?", a: "r² = 0.49 → 49%." },
        { q: "Compute r<sub>s</sub> if n = 6 and Σd² = 14.", a: "1 − 84/210 = 0.60" }
      ],
      excel: `<ul><li><code>=CORREL(B2:B6,C2:C6)</code> or <code>=PEARSON(...)</code>.</li><li>Spearman: rank each column with <code>=RANK.AVG(B2,$B$2:$B$6,0)</code>, then CORREL on the ranks.</li><li>ToolPak → <b>Correlation</b> gives a full correlation matrix for many variables.</li><li>Insert a Scatter chart → Add Trendline → Display R-squared.</li></ul><div class="fx"><span>fx</span>=CORREL(B2:B6,C2:C6)</div>`

    {
      id: "2-5",
      title: "Data Visualisation Techniques",
      sub: "Bar, Histogram, Box plot, Scatter",
      notes: `
<p>A good chart lets a manager see the pattern in seconds. Choose the chart by the <b>question</b> you are answering.</p>
<table class="tbl"><tr><th>Question</th><th>Chart</th><th>Business use</th></tr>
<tr><td>Compare categories</td><td>Bar / column chart</td><td>Sales by region, market share by brand</td></tr>
<tr><td>Show distribution of one numeric variable</td><td>Histogram</td><td>Distribution of order values, delivery times</td></tr>
<tr><td>Compare distributions, spot outliers</td><td>Box-and-whisker plot</td><td>Salary by department, spend by customer type</td></tr>
<tr><td>Relationship between two numeric variables</td><td>Scatter plot</td><td>Ad spend vs sales, time on site vs amount spent</td></tr>
<tr><td>Trend over time</td><td>Line chart</td><td>Monthly revenue</td></tr>
<tr><td>Part of a whole (few parts)</td><td>Pie / 100% stacked bar</td><td>Revenue share of 3 product lines</td></tr></table>
<h4>Building a histogram</h4>
<ol><li>Number of classes ≈ √n or Sturges' rule k = 1 + 3.322 log₁₀ n.</li><li>Class width ≈ (Max − Min)/k, rounded to a convenient number.</li><li>Count frequencies with FREQUENCY or the ToolPak Histogram tool; bars touch because classes are continuous.</li></ol>
<h4>Reading a box plot</h4><p>The box spans Q1 to Q3 with a line at the median; whiskers extend to the most extreme non-outlier values; dots beyond the whiskers are outliers.</p>
<h4>Design principles (Knaflic, <i>Storytelling with Data</i>)</h4>
<ul><li>Remove chart junk: heavy gridlines, 3-D effects, unnecessary legends.</li><li>Use colour to highlight the one thing that matters.</li><li>Write an action title: "North region sales fell 18% in Q3", not "Sales by Region".</li><li>Start bar-chart axes at zero.</li></ul>`,
      formulas: ["Sturges: k = 1 + 3.322 log₁₀ n", "Class width = (Max − Min) / k", "Five-number summary: Min, Q1, Median, Q3, Max"],
      example: `<p><b>50 order values</b> range from ₹120 to ₹980. Sturges: k = 1 + 3.322 × log₁₀(50) = 1 + 3.322 × 1.699 = 6.64 ≈ <b>7 classes</b>. Width = (980 − 120)/7 = 122.9 → use <b>₹150</b> bins starting at ₹100: 100–250, 250–400, … 1000.</p>
<p>If the histogram shows most orders at ₹250–400 with a long right tail, marketing can design a "free delivery above ₹500" offer to pull customers into higher bins.</p>
<div class="viz" data-viz="hist"></div>`,

        { q: "Why must bar-chart axes start at zero but line-chart axes need not?", a: "Bar length encodes the value, so a cut axis exaggerates differences; line charts show change/trend." },
        { q: "What does a long upper whisker in a box plot indicate?", a: "Right skew – larger spread among high values." },
        { q: "Write an action title for a chart showing that UPI payments grew from 30% to 55% of transactions.", a: "e.g. 'UPI now accounts for more than half of all payments, up from 30%'." },
        { q: "Difference between a histogram and a bar chart?", a: "Histogram: continuous numeric classes, bars touch. Bar chart: separate categories, gaps between bars." }
      ],
      excel: `<ul><li><b>Histogram:</b> Insert → Statistic Chart → Histogram (set bin width in Format Axis), or ToolPak → Histogram with a bin range.</li><li><b>Box plot:</b> Insert → Statistic Chart → Box and Whisker.</li><li><b>PivotChart:</b> Insert → PivotChart to summarise and chart by category in one step.</li><li><code>=FREQUENCY(B2:B51,D2:D8)</code> returns counts for bin upper limits.</li></ul><div class="fx"><span>fx</span>=FREQUENCY(B2:B51,D2:D8)</div>`

    {
      id: "2-6",
      title: "Excel Application: ToolPak & PivotTables",
      sub: "Descriptive Statistics, Histogram, PivotTables, key functions",
      notes: `
<p>This topic pulls Unit 2 together into an Excel workflow you will use in every case study.</p>

<ul><li>Addition: P(A or B) = P(A) + P(B) − P(A and B)</li><li>Multiplication (independent events): P(A and B) = P(A) × P(B)</li><li>Conditional: P(A | B) = P(A and B) / P(B)</li></ul>
<h4>Binomial distribution (discrete)</h4>
<p>Use when there are <b>n</b> independent trials, each with two outcomes (success/failure) and a constant probability p. Examples: number of customers out of 10 who buy; defective items in a batch.</p>
<p>Mean = np, Variance = np(1 − p).</p>
<h4>Poisson distribution (discrete)</h4>

<p>A <b>time series</b> is data recorded at regular intervals (daily sales, monthly demand). Forecasting it supports inventory, staffing and budgeting.</p>
<h4>Components</h4><ul><li><b>Trend</b> – long-term upward/downward movement.</li><li><b>Seasonal</b> – regular pattern within a year (Diwali, summer).</li><li><b>Cyclical</b> – multi-year business cycles.</li><li><b>Irregular</b> – random noise.</li></ul>
<h4>Methods</h4>
<ul><li><b>Moving average (MA):</b> forecast = average of the last k periods. Larger k = smoother but slower to react.</li>
<li><b>Exponential smoothing:</b> F<sub>t+1</sub> = αY<sub>t</sub> + (1 − α)F<sub>t</sub>, 0 &lt; α &lt; 1. Higher α reacts faster to recent changes.</li>
<li><b>Linear trend:</b> Ŷ<sub>t</sub> = b₀ + b₁t, fitted by regression on the time index.</li>
<li><b>Seasonal model:</b> compute seasonal indices (average of each season ÷ overall average) and multiply the trend forecast by the index; or use quarter dummies in regression.</li></ul>
<h4>Forecast accuracy</h4><p>Error e<sub>t</sub> = Actual − Forecast. Choose the method with the lowest error on past data.</p>`,

<p>With many candidate predictors, we want a model that is <b>simple, accurate and generalises</b> to new data (avoids over-fitting).</p>
<h4>Tools for selection</h4>
<ul><li><b>Adjusted R²</b> – higher is better; penalises extra variables.</li><li><b>Standard error of estimate</b> – lower is better.</li><li><b>t-tests / p-values</b> of individual coefficients.</li><li><b>Partial F-test</b> – tests whether a <em>group</em> of q variables adds significant explanatory power.</li></ul>
<h4>Search strategies</h4>
<ul><li><b>Forward selection:</b> start with none; add the most significant variable at each step.</li><li><b>Backward elimination:</b> start with all; remove the least significant one at a time.</li><li><b>Stepwise:</b> forward, but re-check and drop variables that become insignificant.</li><li><b>Best subsets:</b> evaluate all combinations and compare adjusted R² (feasible for few variables).</li></ul>
<h4>Validation on a holdout sample</h4>
<p>Split data (e.g. 70% training, 30% holdout). Build the model on training data, then compute forecast errors (MAPE, RMSE) on the holdout. A model that performs much worse on the holdout is over-fitted. This is exactly how machine-learning models are evaluated too (see the AI Lab tab).</p>`,

<p>Partial F = [(480 − 360)/2] / [360/(30 − 5 − 1)] = 60 / 15 = <b>4.0</b>.</p>
<p>F<sub>crit</sub>(2, 24) at 5% = 3.40. Since 4.0 &gt; 3.40, the two variables <b>together</b> add significant explanatory power – keep them.</p>`,
      numericals: [

        { q: `A model has training MAPE = 4% and holdout MAPE = 18%. A simpler model has training MAPE = 7% and holdout MAPE = 8%. Which is better and why?`,

      sub: "Purpose, assumptions, interpreting output",
      notes: `
<p>Surveys often have many correlated questions. <b>Factor analysis (FA)</b> and <b>principal component analysis (PCA)</b> reduce many variables to a few underlying dimensions.</p>
<h4>Difference</h4>
<table class="tbl"><tr><th></th><th>PCA</th><th>Factor Analysis</th></tr><tr><td>Goal</td><td>Data reduction – summarise total variance in fewer components</td><td>Discover latent constructs (e.g. "Service Quality") that cause item responses</td></tr><tr><td>Variance used</td><td>Total variance</td><td>Common (shared) variance</td></tr><tr><td>Typical use</td><td>Remove multicollinearity before regression; create indices</td><td>Scale development, validating questionnaires</td></tr></table>
<h4>Assumptions</h4>
<ul><li>Interval-level (or Likert) variables, reasonably correlated with each other (many |r| &gt; 0.3).</li><li>Adequate sample: at least 5–10 respondents per variable; KMO &gt; 0.6; Bartlett's test significant.</li></ul>
<h4>Reading the output</h4>
<ul><li><b>Eigenvalue:</b> variance explained by a factor (in "number of variables" units). <b>Kaiser rule:</b> keep factors with eigenvalue &gt; 1.</li><li><b>Scree plot:</b> keep factors before the "elbow".</li><li><b>% of variance explained</b> = eigenvalue / number of variables.</li><li><b>Loadings:</b> correlation between each variable and a factor; |loading| ≥ 0.5 is meaningful. Name the factor from its high-loading items.</li><li><b>Communality:</b> sum of squared loadings of a variable across retained factors – how much of it the factors explain.</li><li><b>Rotation</b> (Varimax) makes loadings easier to interpret.</li></ul>`,
      formulas: ["% variance of factor = Eigenvalue / p   (p = number of variables)", "Communality h² = Σ (loading)²", "Kaiser criterion: retain eigenvalue > 1"],

<ul><li>Kaiser rule → retain <b>2 factors</b>.</li><li>Factor 1 explains 3.2/6 = 53.3%; Factor 2 explains 1.8/6 = 30.0%; together <b>83.3%</b>.</li></ul>
<table class="tbl"><tr><th>Item</th><th>F1</th><th>F2</th></tr><tr><td>Staff are courteous</td><td>0.85</td><td>0.12</td></tr><tr><td>Queries resolved quickly</td><td>0.80</td><td>0.20</td></tr><tr><td>Staff are knowledgeable</td><td>0.78</td><td>0.15</td></tr><tr><td>App is easy to use</td><td>0.10</td><td>0.88</td></tr><tr><td>Online transfers are fast</td><td>0.18</td><td>0.82</td></tr><tr><td>Net-banking is secure</td><td>0.25</td><td>0.70</td></tr></table>
<p>Name F1 = <b>"People Service"</b>, F2 = <b>"Digital Convenience"</b>. The bank can now track two scores instead of six items and use them as predictors of loyalty.</p>`,

    {

      title: "Cluster Analysis for Market Segmentation",
      sub: "Distance measures, hierarchical and k-means",
      notes: `
<p><b>Cluster analysis</b> groups customers (or products, stores) so that members of a cluster are similar to each other and different from other clusters. It is the statistical engine behind <b>market segmentation</b>.</p>
<h4>Distance measures</h4><ul><li><b>Euclidean:</b> straight-line distance √Σ(x<sub>i</sub> − y<sub>i</sub>)².</li><li><b>Manhattan:</b> Σ|x<sub>i</sub> − y<sub>i</sub>|.</li></ul>
<p class="tip"><b>Standardise</b> variables (z-scores) first; otherwise a variable in rupees will dominate one measured in visits.</p>
<h4>Hierarchical clustering</h4><p>Start with each case as its own cluster and repeatedly merge the two closest (agglomerative). Linkage: single (nearest), complete (farthest), average, or Ward's (minimum variance). The <b>dendrogram</b> shows merges; cut it where distances jump to choose the number of clusters.</p>
<h4>k-means clustering</h4><ol><li>Choose k and initial centroids.</li><li>Assign each case to the nearest centroid.</li><li>Recompute each centroid as the mean of its members.</li><li>Repeat until assignments stop changing.</li></ol>
<p>Choose k with the <b>elbow method</b> (plot within-cluster sum of squares against k) and business sense – each segment must be large, distinct and actionable.</p>

      example: `<p><b>Six customers</b> (annual spend ₹'000, visits per month): P1 (2, 2), P2 (3, 2), P3 (2, 3), P4 (8, 8), P5 (9, 8), P6 (8, 9). k = 2, initial centroids P1 and P4.</p>
<p><b>Iteration 1 – assign:</b> d(P2, P1) = 1.0 vs d(P2, P4) = √(25 + 36) = 7.81 → cluster 1. Similarly P3 → 1; P5, P6 → 2.</p>
<p><b>Update centroids:</b> C1 = ((2+3+2)/3, (2+2+3)/3) = <b>(2.33, 2.33)</b>; C2 = <b>(8.33, 8.33)</b>.</p>
<p><b>Iteration 2:</b> no customer changes cluster → stop.</p><p>Segments: <b>"Occasional low spenders"</b> and <b>"Frequent high spenders"</b>. Marketing can send loyalty perks to cluster 2 and win-back offers to cluster 1.</p>

      numericals: [
        { q: `Compute the Euclidean and Manhattan distances between Customer A (age 30, income ₹6 lakh) and Customer B (age 34, income ₹9 lakh). Why is standardisation important here?`,

        { q: `Distances between 4 stores: d(A,B) = 2, d(A,C) = 6, d(A,D) = 10, d(B,C) = 5, d(B,D) = 9, d(C,D) = 4. Perform single-linkage hierarchical clustering.`,

    {

      sub: "Price relatives, aggregate and weighted indexes, CPI, deflating",

<p>An <b>index number</b> measures the relative change in a variable (price, quantity, value) compared with a <b>base period</b> set to 100.</p>
<h4>Types</h4>
<ul><li><b>Price relative:</b> (p₁/p₀) × 100 for a single item.</li><li><b>Simple aggregate price index:</b> (Σp₁/Σp₀) × 100 – ignores quantities, so expensive items dominate.</li><li><b>Weighted aggregate indexes:</b>
<ul><li><b>Laspeyres:</b> base-period quantities as weights – easy to update, tends to overstate inflation.</li><li><b>Paasche:</b> current-period quantities – reflects current consumption, needs new quantity data each period.</li><li><b>Fisher's ideal:</b> geometric mean of Laspeyres and Paasche.</li></ul></li></ul>
<h4>Consumer Price Index (CPI)</h4><p>A weighted index of the prices of a fixed basket of goods and services bought by households. In India, CPI (Combined) is published by NSO/MoSPI and is the RBI's main inflation target measure.</p>

      notes: `
<p><b>Statistical quality control (SQC)</b> uses sampling to monitor whether a process is stable ("in control") and capable of meeting specifications.</p>
<h4>Variation</h4><ul><li><b>Common cause:</b> natural, random variation built into the process.</li><li><b>Assignable (special) cause:</b> a specific problem – worn tool, new operator, bad raw material – that should be found and fixed.</li></ul>
<h4>Control charts</h4><table class="tbl"><tr><th>Chart</th><th>Monitors</th><th>Data</th></tr><tr><td>x̄ chart</td><td>Process mean</td><td>Measurements (weight, time)</td></tr><tr><td>R chart</td><td>Process variability</td><td>Measurements</td></tr><tr><td>p chart</td><td>Proportion defective</td><td>Attributes (defective / OK)</td></tr></table>
<p>Limits are set at ±3 standard errors around the centre line. A process is <b>out of control</b> if a point falls outside the limits, or there are non-random patterns (e.g. 7+ points in a row on one side of the centre line, or a steady trend).</p>
<h4>Control chart constants (selected)</h4><table class="tbl"><tr><th>n</th><th>A₂</th><th>D₃</th><th>D₄</th><th>d₂</th></tr><tr><td>4</td><td>0.729</td><td>0</td><td>2.282</td><td>2.059</td></tr><tr><td>5</td><td>0.577</td><td>0</td><td>2.114</td><td>2.326</td></tr><tr><td>6</td><td>0.483</td><td>0</td><td>2.004</td><td>2.534</td></tr></table>
<h4>Process capability</h4><p>Control limits describe what the process <em>does</em>; specification limits (USL, LSL) describe what the customer <em>needs</em>. C<sub>p</sub> compares spec width with process spread; C<sub>pk</sub> also accounts for centring. C<sub>pk</sub> ≥ 1.33 is commonly required.</p>
<h4>Six Sigma</h4><p>A method aiming for no more than 3.4 defects per million opportunities (DPMO). It follows <b>DMAIC</b>: Define, Measure, Analyse, Improve, Control. A Six Sigma process has C<sub>p</sub> = 2.</p>`,
      formulas: ["x̄ chart: UCL/LCL = x̿ ± A₂R̄", "R chart: UCL = D₄R̄, LCL = D₃R̄", "p chart: p̄ ± 3√[p̄(1 − p̄)/n]  (LCL ≥ 0)", "C<sub>p</sub> = (USL − LSL) / 6σ", "C<sub>pk</sub> = min[(USL − μ)/3σ, (μ − LSL)/3σ]", "DPMO = defects / (units × opportunities) × 10⁶"],

<ul><li>x̄ chart: UCL = 50 + 0.577 × 4 = <b>52.31 g</b>; LCL = <b>47.69 g</b></li><li>R chart: UCL = 2.114 × 4 = <b>8.46 g</b>; LCL = 0</li></ul>
<p>If sample 14 has x̄ = 53.1 g, it is above the UCL → investigate the filling machine for that shift.</p>
<div class="viz" data-viz="control"></div>`,

        { q: `An online store checks 200 orders per day for errors. Over 20 days, the average error proportion p̄ = 0.04. Compute p-chart limits. Day 9 had 17 errors – is it in control?`,
          s: `<p>σ<sub>p</sub> = √(0.04 × 0.96/200) = √0.000192 = 0.01386.</p><p>UCL = 0.04 + 3 × 0.01386 = <b>0.0816</b>; LCL = 0.04 − 0.0416 = negative → <b>0</b>.</p><p>Day 9: 17/200 = 0.085 &gt; 0.0816 → <b>out of control</b>; find the assignable cause (new staff, system glitch).</p>` },

<p>Surveys are the most common primary-data tool in business research. Quality depends on the questionnaire as much as on the analysis.</p>
<h4>Questionnaire design</h4>
<ol><li>Start from research objectives – every question must map to an objective.</li><li>Decide question types: closed (multiple choice, rating), open-ended, ranking.</li><li>Word questions simply, neutrally; avoid double-barrelled ("price and quality"), leading and jargon.</li><li>Order: easy screening questions → core questions → sensitive and demographic questions last.</li><li><b>Pilot test</b> with 10–20 respondents and revise.</li></ol>
<h4>Scaling techniques</h4><ul><li><b>Likert:</b> agreement 1–5 or 1–7.</li><li><b>Semantic differential:</b> bipolar adjectives (Cheap ___ Expensive).</li><li><b>Net Promoter Score:</b> 0–10 likelihood to recommend; NPS = % promoters (9–10) − % detractors (0–6).</li></ul>
<h4>Reliability and validity</h4><p><b>Reliability</b> = consistency; measured by <b>Cronbach's alpha</b> (≥ 0.7 acceptable). <b>Validity</b> = measuring what you intend (content, construct, criterion validity).</p>
<h4>Coding and analysis</h4><ul><li>Create a <b>codebook</b>: variable name, question, codes (1 = Male, 2 = Female, 99 = No answer).</li><li>Reverse-code negatively worded items (6 − x on a 5-point scale).</li><li><b>Cross-tabulation</b> (PivotTable) with row/column percentages, then a chi-square test.</li></ul>

/* ---------- markdown-lite for AI answers ---------- */
function md(src) {
  const lines = String(src).replace(/\r/g, "").split("\n");
  let out = "", list = null, para = [], table = [];
  const inline = t => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>");
  const flushP = () => { if (para.length) { out += "<p>" + para.map(inline).join("<br>") + "</p>"; para = []; } };
  const flushL = () => { if (list) { out += `<${list.t}>` + list.items.map(i => "<li>" + inline(i) + "</li>").join("") + `</${list.t}>`; list = null; } };
  const flushT = () => {
    if (!table.length) return;
    const rows = table.filter(r => !/^\s*\|?\s*:?-{2,}/.test(r)).map(r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim()));
    out += '<div class="tblwrap"><table class="tbl">' + rows.map((r, i) => "<tr>" + r.map(c => i ? `<td>${inline(c)}</td>` : `<th>${inline(c)}</th>`).join("") + "</tr>").join("") + "</table></div>";
    table = [];
  };
  for (const l of lines) {
    if (/^\s*\|.*\|\s*$/.test(l)) { flushP(); flushL(); table.push(l); continue; } else flushT();
    let m;
    if (/^\s*$/.test(l)) { flushP(); flushL(); continue; }
    if ((m = l.match(/^#{1,4}\s+(.*)/))) { flushP(); flushL(); out += "<p><b>" + inline(m[1]) + "</b></p>"; continue; }
    if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { flushP(); if (!list || list.t !== "ul") { flushL(); list = { t: "ul", items: [] }; } list.items.push(m[1]); continue; }
    if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { flushP(); if (!list || list.t !== "ol") { flushL(); list = { t: "ol", items: [] }; } list.items.push(m[1]); continue; }
    flushL(); para.push(l);
  }
  flushP(); flushL(); flushT();
  return out;
}

function renderTopic(u, t) {
  const idx = u.topics.indexOf(t);

function qCard(n, q, sol, label) {

/* ---------- AI calls ---------- */
const TUTOR_RULES = "You are a friendly, precise tutor for an MBA/BBA course 'Business Research and Statistics' taught with Microsoft Excel. Use Indian business examples (₹) where helpful. Show calculations step by step, name the Excel function or Analysis ToolPak tool to use, and keep answers under 300 words unless asked for more. Use short paragraphs, bullet lists and **bold** for key terms. Do not use LaTeX; write formulas in plain text.";
let askCtl = null;
async function ask(question, ctx, outEl, btn) {
  if (!sample) return;
  askCtl?.abort(); askCtl = new AbortController();
  outEl.innerHTML = `<div class="answer"><p class="muted">Thinking…</p></div>`;
  const box = outEl.firstChild; if (btn) btn.disabled = true;
  try {
    await sample(`${TUTOR_RULES}\n\nContext – ${ctx}\n\nStudent's question: ${question}`, { signal: askCtl.signal, cache: false, onText: ({ text }) => { box.innerHTML = md(text); } });
  } catch (e) { box.innerHTML = (e.text ? md(e.text) : "") + `<p class="note">${esc(errCopy(e))}</p>`; if (e.code === "not_granted" || e.code === "sampling_disabled") disableAI(); }
  finally { if (btn) btn.disabled = false; }
}
async function genProblem(t, u) {
  const out = $("#aiGenOut"), btn = $("#aiGen");
  btn.disabled = true; out.innerHTML = `<div class="answer"><p class="muted">Writing a new problem…</p></div>`;
  try {
    const r = await sample.json(`Create ONE new exam-style ${t.numLabel ? "applied business problem" : "numerical problem"} for the topic "${t.title}" (${t.sub}) in the course Business Research and Statistics (Unit ${u.n}: ${u.title}). Use a realistic Indian business context with ₹ where relevant. Numbers must work out exactly; double-check every calculation. Reply with only JSON: {"question": string, "steps": [string, ...], "answer": string, "excel": string}. "steps" is the step-by-step solution (3-7 steps, plain text, no LaTeX); "excel" is the Excel formula or ToolPak tool that verifies it.`, { cache: false });
    if (!r || !r.question) throw { code: "invalid_json" };
    const sol = `<ol>${(r.steps || []).map(s => `<li>${esc(s)}</li>`).join("")}</ol><p><b>Answer:</b> ${esc(r.answer || "")}</p>${r.excel ? `<div class="fx"><span>fx</span><div class="fx-text">${esc(r.excel)}</div></div>` : ""}<p class="note">AI-generated – check the working yourself in Excel.</p>`;
    out.innerHTML = `<div style="margin-top:12px">${qCard("AI", `<p>${esc(r.question)}</p>`, sol, "Show solution")}</div>`;
  } catch (e) { out.innerHTML = `<p class="note">${esc(errCopy(e))}</p>`; if (e.code === "not_granted" || e.code === "sampling_disabled") disableAI(); }
  finally { btn.disabled = false; }
}
function disableAI() { sample = null; document.body.classList.remove("has-ai"); }

/* ---------- topic wiring ---------- */
function initTopic(u) {
  const m = $("#main");
  m.querySelectorAll("[data-topic]").forEach(b => b.onclick = () => { state.topic[u.n] = b.dataset.topic; state.sub = "notes"; try { history.replaceState(null, "", "#t" + b.dataset.topic); } catch (e) {} render(); $("#topicPane").scrollIntoView({ block: "start" }); window.scrollBy(0, -60); });

function wireTutor(root) {
  const out = $("#askOut", root), txt = $("#askTxt", root), btn = $("#askBtn", root);
  if (!btn) return;
  const ctx = tutorCtx;
  root.querySelectorAll("[data-ask]").forEach(b => b.onclick = () => { txt.value = b.dataset.ask; ask(b.dataset.ask, ctx, out, btn); });
  btn.onclick = () => { const q = txt.value.trim(); if (q) ask(q, ctx, out, btn); else txt.focus(); };
  txt.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); btn.click(); } };
}

  <path d="M103 136v-38" style="stroke:var(--hi);stroke-width:1.5;stroke-dasharray:4 3"/><path d="M98 104l5-6 5 6" style="fill:none;stroke:var(--hi);stroke-width:1.5"/>
  <text x="112" y="122" style="fill:var(--hi)">feedback: new data retrains the model</text></svg>`;
  return `<div class="lab-hero"><div>
    <span class="chip" style="color:var(--hi);border-color:var(--hi)">AI LAB</span>

}
function stats(v) {
  const s = [...v].sort((a, b) => a - b), n = s.length, mean = s.reduce((a, b) => a + b, 0) / n;
  const q = p => { const pos = p * (n + 1); if (pos <= 1) return s[0]; if (pos >= n) return s[n - 1]; const f = Math.floor(pos); return s[f - 1] + (pos - f) * (s[f] - s[f - 1]); };
  const sd = Math.sqrt(s.reduce((a, x) => a + (x - mean) ** 2, 0) / (n - 1));
  const skew = n > 2 ? n / ((n - 1) * (n - 2)) * s.reduce((a, x) => a + ((x - mean) / sd) ** 3, 0) : 0;
  const freq = {}; s.forEach(x => freq[x] = (freq[x] || 0) + 1); const mf = Math.max(...Object.values(freq));
  const mode = mf > 1 ? Object.keys(freq).filter(k => freq[k] === mf).join(", ") : "none";
  return { n, mean, median: q(.5), mode, sd, min: s[0], max: s[n - 1], q1: q(.25), q3: q(.75), skew, cv: sd / mean * 100, sorted: s };
}
let lastStats = null;
function runAnalyst() {
  const v = ($("#anData").value.match(/-?\d+(\.\d+)?/g) || []).map(Number);
  const box = $("#anStats");
  if (v.length < 3) { box.innerHTML = `<p class="note">Enter at least 3 numbers.</p>`; $("#anHist").innerHTML = ""; lastStats = null; return; }
  const st = stats(v); lastStats = st;
  const f = x => typeof x === "number" ? (Math.abs(x) >= 100 ? x.toFixed(1) : x.toFixed(2)) : x;
  const iqr = st.q3 - st.q1, lo = st.q1 - 1.5 * iqr, hi = st.q3 + 1.5 * iqr, outl = st.sorted.filter(x => x < lo || x > hi);
  st.outliers = outl;
  box.innerHTML = [["n", st.n], ["Mean", f(st.mean)], ["Median", f(st.median)], ["Mode", st.mode], ["Std dev", f(st.sd)], ["CV %", f(st.cv)], ["Q1", f(st.q1)], ["Q3", f(st.q3)], ["Min", f(st.min)], ["Max", f(st.max)], ["Skewness", f(st.skew)], ["Outliers", outl.length ? outl.join(", ") : "none"]]
    .map(([k, x]) => `<div class="stat"><small>${k}</small><b>${esc(x)}</b></div>`).join("");
  const k = Math.max(3, Math.min(10, Math.round(1 + 3.322 * Math.log10(st.n)))), w = (st.max - st.min) / k || 1, bins = Array(k).fill(0);
  st.sorted.forEach(x => bins[Math.min(k - 1, Math.floor((x - st.min) / w))]++);
  const W = 520, H = 200, L = 30, B = 28, T = 10, mx = Math.max(...bins), bw = (W - L - 10) / k;
  let g = `<line class="ax" x1="${L}" x2="${W - 10}" y1="${H - B}" y2="${H - B}"/>`;
  bins.forEach((c, i) => { const h = c / mx * (H - B - T); g += `<rect class="m1" x="${L + i * bw + 1}" y="${H - B - h}" width="${bw - 2}" height="${h}"/><text x="${L + i * bw + bw / 2}" y="${H - B - h - 4}" text-anchor="middle">${c}</text>`; });
  [0, k].forEach(i => g += `<text x="${L + i * bw}" y="${H - B + 16}" text-anchor="${i ? "end" : "start"}">${f(st.min + i * w)}</text>`);
  $("#anHist").innerHTML = svgWrap(W, H, g, `Histogram (${k} classes by Sturges' rule). Excel check: =AVERAGE(), =STDEV.S(), =SKEW()`);
}
let chatTurns = [];
function initAI() {
  const m = $("#main");
  m.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => {
    const el = document.getElementById(b.dataset.copy);
    try { await navigator.clipboard.writeText(el.textContent); b.textContent = "Copied"; }
    catch (e) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Selected – press Ctrl+C"; }
    setTimeout(() => b.textContent = "Copy prompt", 2000);
  });
  $("#anRun").onclick = runAnalyst; runAnalyst();
  $("#anAI").onclick = () => {
    runAnalyst(); if (!lastStats) return;
    const s = lastStats, f = x => +x.toFixed(3);
    const ctx = `A student pasted data: "${$("#anVar").value}". Computed statistics: n=${s.n}, mean=${f(s.mean)}, median=${f(s.median)}, mode=${s.mode}, SD=${f(s.sd)}, CV=${f(s.cv)}%, Q1=${f(s.q1)}, Q3=${f(s.q3)}, min=${s.min}, max=${s.max}, skewness=${f(s.skew)}, outliers (1.5×IQR)=${s.outliers.join(", ") || "none"}. Raw values: ${s.sorted.join(", ").slice(0, 1500)}.`;
    ask("Interpret these statistics for a manager: centre, spread, shape and outliers. Then suggest 2 business actions and 1 further statistical test or chart to try in Excel (name the function/tool). Keep it under 220 words.", ctx, $("#anOut"), $("#anAI"));
  };
  const msgs = $("#msgs"), txt = $("#chatTxt"), send = $("#chatSend");
  let ctl = null;
  const add = (cls, html) => { const d = document.createElement("div"); d.className = "msg " + cls; d.innerHTML = html; msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight; return d; };
  send.onclick = async () => {
    const q = txt.value.trim(); if (!q || !sample) return;
    txt.value = ""; add("u", md(q)); chatTurns.push({ role: "user", content: q });
    const sel = $("#chatUnit").value, u = UNITS.find(x => String(x.n) === sel);
    const focus = sel === "ai" ? "Focus: how AI and machine learning are used in business research and statistics, linked to the course syllabus." : u ? `Focus: Unit ${u.n} – ${u.title}. Topics: ${u.topics.map(t => t.title).join("; ")}.` : `Course units: ${UNITS.map(x => x.n + ". " + x.title).join("; ")}.`;
    const bubble = add("a", `<p class="muted">Thinking…</p>`); send.disabled = true;
    ctl?.abort(); ctl = new AbortController();
    const turns = [{ role: "user", content: TUTOR_RULES + " " + focus }, ...chatTurns.slice(-10)];
    try { const { text } = await sample(turns, { cache: false, signal: ctl.signal, onText: ({ text }) => { bubble.innerHTML = md(text); msgs.scrollTop = msgs.scrollHeight; } }); chatTurns.push({ role: "assistant", content: text }); }
    catch (e) { bubble.innerHTML = (e.text ? md(e.text) : "") + `<p class="note">${esc(errCopy(e))}</p>`; chatTurns.pop(); if (e.code === "not_granted" || e.code === "sampling_disabled") disableAI(); }
    finally { send.disabled = false; }
  };
  txt.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send.click(); } };
  $("#chatClear").onclick = () => { chatTurns = []; msgs.innerHTML = msgs.firstElementChild.outerHTML; };
}
